services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  waha:
    image: devlikeapro/waha
    container_name: zenda-waha
    restart: always
    ports:
      - "3001:3000"
    environment:
      - WAHA_PRINT_QR=true

volumes:
  postgres_data:
