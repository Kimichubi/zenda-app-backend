apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenda-backend
  labels:
    app: zenda-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: zenda-backend
  template:
    metadata:
      labels:
        app: zenda-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/kimichubi/zenda-app-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: zenda-backend-config
            - secretRef:
                name: zenda-backend-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zenda-postgres
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: zenda-redis
                  key: url
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: ghcr-secret
