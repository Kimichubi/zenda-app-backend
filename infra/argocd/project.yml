apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zenda
  namespace: argocd
spec:
  description: Zenda - agendamento de salão de beleza
  sourceRepos:
    - "https://github.com/kimichubi/zenda-app-backend"
  destinations:
    - namespace: zenda
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  orphanedResources:
    warn: true
