apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zenda-backend
  namespace: argocd
spec:
  project: zenda
  source:
    repoURL: "https://github.com/kimichubi/zenda-app-backend"
    targetRevision: main
    path: infra/argocd/kustomize/overlays/production
  destination:
    server: "https://kubernetes.default.svc"
    namespace: zenda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 3m
        factor: 2
