services:
  prometheus:
    build:
      context: .
      dockerfile: infra/monitoring/Dockerfile.prometheus
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-kimichubi}/zenda-prometheus:${TAG:-latest}
    container_name: zenda-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    networks:
      - zenda-monitoring

  grafana:
    build:
      context: .
      dockerfile: infra/monitoring/Dockerfile.grafana
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER:-kimichubi}/zenda-grafana:${TAG:-latest}
    container_name: zenda-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3002:3000"
    networks:
      - zenda-monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: zenda-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - zenda-monitoring
      - zenda-default

  node-exporter:
    image: prom/node-exporter:latest
    container_name: zenda-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    networks:
      - zenda-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  zenda-monitoring:
    driver: bridge
  zenda-default:
    external: true
    name: zenda-app-backend_default
